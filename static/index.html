<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clipboard History</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8a90a2;
    --accent: #5b8cff;
    --highlight: rgba(255, 209, 91, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  #count {
    font-size: 12px;
    color: var(--muted);
  }
  .controls {
    display: flex;
    gap: 10px;
    max-width: 640px;
  }
  #search {
    flex: 1;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #filter {
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  main {
    padding: 20px 32px;
    max-width: 900px;
  }
  .clip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }
  .clip:hover {
    border-color: #333a4a;
  }
  .clip-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .meta-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(91, 140, 255, 0.15);
    color: var(--accent);
  }
  .badge.code {
    background: rgba(255, 209, 91, 0.15);
    color: #ffd15b;
  }
  .timestamp {
    font-size: 12px;
    color: var(--muted);
    cursor: default;
  }
  .clip-text {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .clip-text.code {
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    background: #0c0e13;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .clip-text.collapsed {
    max-height: 140px;
    overflow: hidden;
    position: relative;
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  }
  mark {
    background: var(--highlight);
    color: inherit;
    border-radius: 2px;
  }
  .toggle-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .clip-image {
    max-width: 100%;
    max-height: 300px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
    margin-bottom: 8px;
  }
  .ocr-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .copy-btn {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .copy-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  #empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Clipboard History</h1>
    <span id="count"></span>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search everything you've copied...  (press / to focus)">
    <select id="filter">
      <option value="all">All types</option>
    </select>
  </div>
</header>

<main>
  <div id="results"></div>
  <div id="empty">No clips found.</div>
</main>

<script>
const resultsEl = document.getElementById('results');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const filterEl = document.getElementById('filter');
const countEl = document.getElementById('count');

let currentClips = [];
let currentQuery = '';
const AUTO_REFRESH_MS = 4000;
const COLLAPSE_THRESHOLD = 500;

const CODE_LANGUAGES = new Set([
  'python','rust','javascript','typescript','java','c','cpp',
  'csharp','php','sql','html','css','shell','json'
]);

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function badgeLabelFor(clip) {
  if (clip.content_type === 'text' && clip.language && clip.language !== 'text') {
    return clip.language;
  }
  return clip.content_type;
}

function isCodeClip(clip) {
  return clip.content_type === 'text' && CODE_LANGUAGES.has(clip.language);
}

function relativeTime(timestampStr) {
  const parsed = new Date(timestampStr.replace(' ', 'T'));
  if (isNaN(parsed.getTime())) return timestampStr;

  const diffMs = Date.now() - parsed.getTime();
  const diffSec = Math.floor(diffMs / 1000);

  if (diffSec < 5) return 'just now';
  if (diffSec < 60) return `${diffSec}s ago`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  return `${diffDay}d ago`;
}

function highlightMatches(text, query) {
  const escaped = escapeHtml(text);
  if (!query) return escaped;

  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(escapedQuery, 'gi');
  return escaped.replace(re, (match) => `<mark>${match}</mark>`);
}

function updateFilterOptions(clips) {
  const labels = new Set(clips.map(badgeLabelFor));
  const previousValue = filterEl.value;

  filterEl.innerHTML = '<option value="all">All types</option>';
  for (const label of labels) {
    const opt = document.createElement('option');
    opt.value = label;
    opt.textContent = label;
    filterEl.appendChild(opt);
  }

  if ([...labels, 'all'].includes(previousValue)) {
    filterEl.value = previousValue;
  }
}

function copyToClipboard(text, buttonEl) {
  navigator.clipboard.writeText(text).then(() => {
    const original = buttonEl.textContent;
    buttonEl.textContent = 'Copied!';
    setTimeout(() => { buttonEl.textContent = original; }, 1200);
  });
}

function renderClips(clips) {
  updateFilterOptions(clips);

  const selectedFilter = filterEl.value;
  const visibleClips = selectedFilter === 'all'
    ? clips
    : clips.filter(c => badgeLabelFor(c) === selectedFilter);

  countEl.textContent = clips.length === 1 ? '1 clip' : `${clips.length} clips`;

  resultsEl.innerHTML = '';

  if (visibleClips.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  for (const clip of visibleClips) {
    const card = document.createElement('div');
    card.className = 'clip';

    const badgeLabel = badgeLabelFor(clip);
    const isCode = isCodeClip(clip);
    const copyableText = clip.content_type === 'image' ? (clip.ocr_text || '') : clip.content;

    let bodyHtml = '';

    if (clip.content_type === 'image') {
      bodyHtml += `<img class="clip-image" src="/${escapeHtml(clip.content)}">`;
      if (clip.ocr_text) {
        const isLong = clip.ocr_text.length > COLLAPSE_THRESHOLD;
        const highlighted = highlightMatches(clip.ocr_text, currentQuery);
        bodyHtml += `<div class="ocr-label">Extracted text</div>`;
        bodyHtml += `<div class="clip-text ${isLong ? 'collapsed' : ''}">${highlighted}</div>`;
        if (isLong) bodyHtml += `<div class="toggle-link">Show more</div>`;
      }
    } else {
      const isLong = clip.content.length > COLLAPSE_THRESHOLD;
      const highlighted = highlightMatches(clip.content, currentQuery);
      bodyHtml += `<div class="clip-text ${isCode ? 'code' : ''} ${isLong ? 'collapsed' : ''}">${highlighted}</div>`;
      if (isLong) bodyHtml += `<div class="toggle-link">Show more</div>`;
    }

    card.innerHTML = `
      <div class="clip-meta">
        <div class="meta-left">
          <span class="badge ${isCode ? 'code' : ''}">${escapeHtml(badgeLabel)}</span>
          <span class="timestamp" title="${escapeHtml(clip.created_at)}">${relativeTime(clip.created_at)}</span>
        </div>
        <button class="copy-btn">Copy</button>
      </div>
      ${bodyHtml}
    `;

    const copyBtn = card.querySelector('.copy-btn');
    copyBtn.addEventListener('click', () => copyToClipboard(copyableText, copyBtn));

    const toggleLink = card.querySelector('.toggle-link');
    const textEl = card.querySelector('.clip-text');
    if (toggleLink && textEl) {
      toggleLink.addEventListener('click', () => {
        const isCollapsed = textEl.classList.toggle('collapsed');
        toggleLink.textContent = isCollapsed ? 'Show more' : 'Show less';
      });
      toggleLink.textContent = textEl.classList.contains('collapsed') ? 'Show more' : 'Show less';
    }

    resultsEl.appendChild(card);
  }
}

async function loadClips() {
  const res = await fetch('/api/clips');
  currentClips = await res.json();
  currentQuery = '';
  renderClips(currentClips);
}

async function searchClips(query) {
  const res = await fetch('/api/search?q=' + encodeURIComponent(query));
  currentClips = await res.json();
  currentQuery = query;
  renderClips(currentClips);
}

let debounceTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const query = searchEl.value.trim();

  debounceTimer = setTimeout(() => {
    if (query === '') {
      loadClips();
    } else {
      searchClips(query);
    }
  }, 250);
});

filterEl.addEventListener('change', () => {
  renderClips(currentClips);
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchEl) {
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === 'Escape' && document.activeElement === searchEl) {
    searchEl.value = '';
    searchEl.blur();
    loadClips();
  }
});

setInterval(()=>{
  if (searchEl.value.trim() === '') {
    loadClips();
  }
}, AUTO_REFRESH_MS);

loadClips();
</script>

</body>
</html>
