<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clipboard History</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8a90a2;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
  }
  .controls {
    display: flex;
    gap: 10px;
    max-width: 640px;
  }
  #search {
    flex: 1;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #filter {
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  main {
    padding: 20px 32px;
    max-width: 900px;
  }
  .clip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .clip-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .meta-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(91, 140, 255, 0.15);
    color: var(--accent);
  }
  .timestamp {
    font-size: 12px;
    color: var(--muted);
  }
  .clip-text {
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .clip-text.collapsed {
    max-height: 140px;
    overflow: hidden;
    position: relative;
    mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
  }
  .toggle-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
  }
  .clip-image {
    max-width: 100%;
    max-height: 300px;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: block;
    margin-bottom: 8px;
  }
  .ocr-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .copy-btn {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .copy-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  #empty {
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Clipboard History</h1>
  <div class="controls">
    <input id="search" type="text" placeholder="Search everything you've copied...">
    <select id="filter">
      <option value="all">All types</option>
    </select>
  </div>
</header>

<main>
  <div id="results"></div>
  <div id="empty">No clips found.</div>
</main>

<script>
const resultsEl = document.getElementById('results');
const emptyEl = document.getElementById('empty');
const searchEl = document.getElementById('search');
const filterEl = document.getElementById('filter');

// Holds whatever the server last returned, before client-side type filtering.
let currentClips = [];

const COLLAPSE_THRESHOLD = 500; // characters

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function badgeLabelFor(clip) {
  if (clip.content_type === 'text' && clip.language && clip.language !== 'text') {
    return clip.language;
  }
  return clip.content_type;
}

// Rebuilds the filter dropdown's options based on whatever badge labels
// actually appear in the current result set, so it only ever shows
// categories that are actually present.
function updateFilterOptions(clips) {
  const labels = new Set(clips.map(badgeLabelFor));
  const previousValue = filterEl.value;

  filterEl.innerHTML = '<option value="all">All types</option>';
  for (const label of labels) {
    const opt = document.createElement('option');
    opt.value = label;
    opt.textContent = label;
    filterEl.appendChild(opt);
  }

  // Keep the user's previous filter selection if it's still a valid option.
  if ([...labels, 'all'].includes(previousValue)) {
    filterEl.value = previousValue;
  }
}

function copyToClipboard(text, buttonEl) {
  navigator.clipboard.writeText(text).then(() => {
    const original = buttonEl.textContent;
    buttonEl.textContent = 'Copied!';
    setTimeout(() => { buttonEl.textContent = original; }, 1200);
  });
}

function renderClips(clips) {
  updateFilterOptions(clips);

  const selectedFilter = filterEl.value;
  const visibleClips = selectedFilter === 'all'
    ? clips
    : clips.filter(c => badgeLabelFor(c) === selectedFilter);

  resultsEl.innerHTML = '';

  if (visibleClips.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  for (const clip of visibleClips) {
    const card = document.createElement('div');
    card.className = 'clip';

    const badgeLabel = badgeLabelFor(clip);

    // The text we'd copy back to the clipboard if the user clicks Copy —
    // for images, that's the OCR'd text (if any); for text clips, it's the content itself.
    const copyableText = clip.content_type === 'image' ? (clip.ocr_text || '') : clip.content;

    let bodyHtml = '';

    if (clip.content_type === 'image') {
      bodyHtml += `<img class="clip-image" src="/${escapeHtml(clip.content)}">`;
      if (clip.ocr_text) {
        const isLong = clip.ocr_text.length > COLLAPSE_THRESHOLD;
        bodyHtml += `<div class="ocr-label">Extracted text</div>`;
        bodyHtml += `<div class="clip-text ${isLong ? 'collapsed' : ''}">${escapeHtml(clip.ocr_text)}</div>`;
        if (isLong) bodyHtml += `<div class="toggle-link">Show more</div>`;
      }
    } else {
      const isLong = clip.content.length > COLLAPSE_THRESHOLD;
      bodyHtml += `<div class="clip-text ${isLong ? 'collapsed' : ''}">${escapeHtml(clip.content)}</div>`;
      if (isLong) bodyHtml += `<div class="toggle-link">Show more</div>`;
    }

    card.innerHTML = `
      <div class="clip-meta">
        <div class="meta-left">
          <span class="badge">${escapeHtml(badgeLabel)}</span>
          <span class="timestamp">${escapeHtml(clip.created_at)}</span>
        </div>
        <button class="copy-btn">Copy</button>
      </div>
      ${bodyHtml}
    `;

    // Wire up the Copy button for this specific card.
    const copyBtn = card.querySelector('.copy-btn');
    copyBtn.addEventListener('click', () => copyToClipboard(copyableText, copyBtn));

    // Wire up the "Show more" / "Show less" toggle, if this card has one.
    const toggleLink = card.querySelector('.toggle-link');
    const textEl = card.querySelector('.clip-text');
    if (toggleLink && textEl) {
      toggleLink.addEventListener('click', () => {
        const isCollapsed = textEl.classList.toggle('collapsed');
        toggleLink.textContent = isCollapsed ? 'Show more' : 'Show less';
      });
      // Start in the expanded->collapsed state matching the class already set above.
      toggleLink.textContent = textEl.classList.contains('collapsed') ? 'Show more' : 'Show less';
    }

    resultsEl.appendChild(card);
  }
}

async function loadClips() {
  const res = await fetch('/api/clips');
  currentClips = await res.json();
  renderClips(currentClips);
}

async function searchClips(query) {
  const res = await fetch('/api/search?q=' + encodeURIComponent(query));
  currentClips = await res.json();
  renderClips(currentClips);
}

let debounceTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const query = searchEl.value.trim();

  debounceTimer = setTimeout(() => {
    if (query === '') {
      loadClips();
    } else {
      searchClips(query);
    }
  }, 250);
});

filterEl.addEventListener('change', () => {
  renderClips(currentClips);
});

loadClips();
</script>

</body>
</html>
